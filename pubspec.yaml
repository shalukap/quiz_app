name: quiz_app
description: A personalized question bank quiz app.
publish_to: 'none'
version: 1.2.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.0.2
  cupertino_icons: ^1.0.8
  firebase_core: ^4.5.0
  cloud_firestore: ^6.1.3
  firebase_auth: ^6.2.0
  google_sign_in: ^7.2.0
  fl_chart: ^0.70.2
  image_picker: ^1.1.2
  firebase_storage: ^13.2.0
  path: ^1.9.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.jpeg
    - assets/images/google_logo.png
