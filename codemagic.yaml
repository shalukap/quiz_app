# Builds the iOS app on Codemagic's Macs and uploads it to TestFlight.
# Setup: see "App Store (iOS)" in PREMIUM_SETUP.md.
workflows:
  ios-release:
    name: iOS release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: QuizMaster ASC key   # name of the API key added in Codemagic → Team integrations
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.judeshaluka.quizmaster
      groups:
        - quizmaster_ios   # contains REVENUECAT_IOS_KEY and GOOGLE_SERVICE_INFO_PLIST (base64)
    scripts:
      - name: Add GoogleService-Info.plist
        script: echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Get packages
        script: flutter pub get
      - name: Install pods
        script: cd ios && pod install --repo-update
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=REVENUECAT_IOS_KEY=$REVENUECAT_IOS_KEY \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
